<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#16211c" />
    <meta name="description" content="AR-приложение: размещение и управление объектами, цвет, вращение и HDRI-освещение." />
    <title>AR — управление объектами</title>
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
  </head>
  <body>
    <svg class="svg-sprite" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
      <symbol id="icon-cube" viewBox="0 0 24 24"><path d="m12 3 9 5v9l-9 5-9-5V8Z"/><path d="m3 8 9 5 9-5M12 13v9"/></symbol>
      <symbol id="icon-scan" viewBox="0 0 24 24"><path d="M8 3H3v5m13-5h5v5M3 16v5h5m13-5v5h-5M7 12h10m-5-5v10"/></symbol>
      <symbol id="icon-chair" viewBox="0 0 24 24"><path d="M6 12V5a2 2 0 0 1 2-2h8a2 2 0 0 1 2 2v7M4 10v7h16v-7M7 17v4m10-4v4M4 13h16"/></symbol>
      <symbol id="icon-pin" viewBox="0 0 24 24"><path d="M19 10c0 5-7 11-7 11S5 15 5 10a7 7 0 1 1 14 0Z"/><circle cx="12" cy="10" r="2"/></symbol>
      <symbol id="icon-trash" viewBox="0 0 24 24"><path d="M3 6h18M9 6V3h6v3M5 6l1 15h12l1-15M10 10v7m4-7v7"/></symbol>
      <symbol id="icon-close" viewBox="0 0 24 24"><path d="m6 6 12 12M18 6 6 18"/></symbol>
    </svg>

    <main id="app-screen" class="app-screen" aria-label="AR-приложение">
      <div id="preview-stage" class="preview-stage" role="img" aria-label="3D-просмотр выбранного объекта">
        <p id="preview-error" class="preview-error" role="alert" hidden></p>
      </div>
      <div class="app-top">
        <div id="support-badge" class="support-status" data-state="checking" role="status">
          <span class="status-dot"></span><span id="support-label">Проверяем AR…</span>
        </div>
        <div class="model-info"><span id="object-name">Куб</span><span id="preview-size">30 × 30 × 30 см</span><span id="lighting-status">Загрузка окружения…</span></div>
      </div>
      <div class="app-controls">
        <div id="preview-controls-host">
          <details id="object-controls" class="object-controls xr-control" open>
            <summary><span id="selection-label">Настройки нового объекта</span><span class="expand-icon" aria-hidden="true">⌃</span></summary>
            <div class="control-fields">
              <label id="object-selector-row" hidden>Выбран <select id="selected-object" aria-label="Выбранный объект"><option value="">Новый объект</option></select></label>
              <div class="control-row">
                <label>Модель<select id="model-kind"><option value="cube">Куб</option><option value="chair">Кресло</option><option value="sphere">Сфера</option></select></label>
                <label>Материал<select id="material-finish"><option value="matte">Матовый</option><option value="satin" selected>Сатин</option><option value="metal">Металл</option></select></label>
              </div>
              <div class="color-options" role="group" aria-label="Цвет объекта">
                <button type="button" data-color="#b9e67d" style="--swatch:#b9e67d" aria-label="Зелёный" aria-pressed="true"></button>
                <button type="button" data-color="#ef8068" style="--swatch:#ef8068" aria-label="Коралловый" aria-pressed="false"></button>
                <button type="button" data-color="#79b5ee" style="--swatch:#79b5ee" aria-label="Голубой" aria-pressed="false"></button>
                <button type="button" data-color="#e7bd61" style="--swatch:#e7bd61" aria-label="Золотистый" aria-pressed="false"></button>
                <button type="button" data-color="#d3b2ee" style="--swatch:#d3b2ee" aria-label="Сиреневый" aria-pressed="false"></button>
                <button type="button" data-color="#eeeeee" style="--swatch:#eeeeee" aria-label="Белый" aria-pressed="false"></button>
              </div>
              <div class="rotation-controls" role="group" aria-label="Вращение объекта">
                <button type="button" id="rotate-left" aria-label="Повернуть на 15 градусов влево">↶ 15°</button>
                <button type="button" id="auto-rotate" aria-pressed="false">Авто</button>
                <button type="button" id="rotate-right" aria-label="Повернуть на 15 градусов вправо">15° ↷</button>
              </div>
            </div>
          </details>
        </div>
        <button type="button" id="start-ar" class="button button-primary" disabled><svg><use href="#icon-scan" /></svg><span id="start-label">Открыть AR</span></button>
        <p id="support-hint" class="app-hint">Для AR нужно совместимое устройство.</p>
        <p id="error-message" class="error-message" role="alert" hidden></p>
      </div>
    </main>

    <div id="xr-overlay" class="xr-overlay" hidden>
      <div class="xr-top">
        <div class="xr-status" role="status"><span class="status-dot"></span><span id="xr-status-text">Ищем поверхность…</span></div>
        <button type="button" id="end-ar" class="button-icon xr-control" aria-label="Завершить AR"><svg><use href="#icon-close" /></svg></button>
      </div>
      <div class="aim-cross" aria-hidden="true"></div>
      <div class="xr-bottom">
        <p id="xr-instruction" class="xr-instruction">Наведите камеру на пол или стол.</p>
        <button type="button" id="retry-surface" class="button button-secondary xr-control" hidden>Повторить поиск</button>
        <div id="ar-controls-host"></div>
        <div class="xr-actions">
          <button type="button" id="clear-objects" class="button-icon xr-control" aria-label="Удалить все объекты" disabled><svg><use href="#icon-trash" /></svg></button>
        <button type="button" id="place-object" class="button button-primary xr-control" disabled><svg><use href="#icon-pin" /></svg><span>Разместить</span><span id="placed-count" class="count-badge" aria-hidden="true">0</span></button>
        </div>
      </div>
    </div>

    <script type="module" src="/src/main.js"></script>
  </body>
</html>
